name: verify tylr

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.0.0
          dune-cache: true
      - name: Install pinned dependencies
        run: |
          opam repository add archive git+https://github.com/ocaml/opam-repository-archive
          opam switch import opam.export --yes
      - name: Build editor
        run: opam exec -- dune build src --profile release
      - name: Test existing editor
        run: opam exec -- dune runtest --force
      - name: Upload runnable editor
        uses: actions/upload-artifact@v4
        with:
          name: tylr-web
          path: _build/default/src/web/www/
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/tylr-ui" playwright@1.58.2
          "$RUNNER_TEMP/tylr-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise the built editor with the real language server
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/tylr-ui/node_modules/playwright
        run: node --test test/*ui-smoke.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tylr-browser-evidence
          path: _build/ui-artifacts/
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python language server tests
        run: python -m unittest discover -s server/tests -p 'test_*.py' -v
      - name: Generic navigation tests
        run: node --test test/source-client*.mjs
      - run: git diff --check
