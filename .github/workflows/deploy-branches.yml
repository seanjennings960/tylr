name: verify tylr

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.0.0
          dune-cache: true
      - name: Install pinned dependencies
        run: |
          opam repository add archive git+https://github.com/ocaml/opam-repository-archive
          opam switch import opam.export --yes
      - name: Build editor
        run: opam exec -- dune build src --profile release
      - name: Test existing editor
        run: opam exec -- dune runtest --force
      - name: Upload runnable editor
        uses: actions/upload-artifact@v4
        with:
          name: tylr-web
          path: _build/default/src/web/www/
          if-no-files-found: error
